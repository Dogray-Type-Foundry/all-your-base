[package]
name = "autobase-glyphs"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "C ABI wrapper around autobase for the All Your BASE Glyphs plugin"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
autobase = "=0.3.0"
fontheight = "=0.1.8"
skrifa = "=0.37.0"
write-fonts = "=0.43.0"
anyhow = "1"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.static-lang-word-lists]
version = "0.4.1"
default-features = false
features = ["aosp", "libreoffice"]

[profile.release]
panic = "unwind"
